name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Build frontend
        run: npm run build -w @event-platform/frontend

      - name: Check backend syntax
        run: |
          find backend/src -type f -name '*.js' -print0 | while IFS= read -r -d '' file; do
            node --check "$file"
          done
