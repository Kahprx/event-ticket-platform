,0)" stroke="none" stroke-width="0"/><rect x="33" y="413.1" width="28" height="28" rx="33554400" fill="#101a26" stroke="none" stroke-width="0"/><rect x="69" y="411.1" width="285.1" height="78" rx="0" fill="rgba(0,0,0,0)" stroke="none" stroke-width="0"/><rect x="69" y="411.1" width="285.1" height="78" rx="6" fill="#ffffff" stroke="#e3ded2" stroke-width="1"/><text x="71" y="422.2" fill="#182430" font-family="DM Sans" font-size="13" font-weight="400">Chào bạn! Mình là trợ lý của Soundpass. Bạn muốn tìm sự kiện theo thành phố, thể loại hay mức giá nào?</text><rect x="21" y="792" width="348" height="103" rx="0" fill="#ffffff" stroke="#e3ded2" stroke-width="1"/><rect x="33" y="801" width="324" height="32" rx="0" fill="rgba(0,0,0,0)" stroke="none" stroke-width="0"/><rect x="33" y="801" width="257.7" height="32" rx="8" fill="#ffffff" stroke="#e3ded2" stroke-width="1"/><text x="35" y="812.1" fill="#243342" font-family="DM Sans" font-size="13" font-weight="500">Cuối tuần này có gì ở TP. Hồ Chí Minh?</text><rect x="296.7" y="801" width="225.4" height="32" rx="8" fill="#ffffff" stroke="#e3ded2" stroke-width="1"/><text x="298.7" y="812.1" fill="#243342" font-family="DM Sans" font-size="13" font-weight="500">Tìm sự kiện EDM dưới 500.000 ₫</text><rect x="528.1" y="801" width="260.5" height="32" rx="8" fill="#ffffff" stroke="#e3ded2" stroke-width="1"/><text x="530.1" y="812.1" fill="#243342" font-family="DM Sans" font-size="13" font-weight="500">Đêm nhạc acoustic nào đang mở bán?</text><rect x="794.6" y="801" width="174.5" height="32" rx="8" fill="#ffffff" stroke="#e3ded2" stroke-width="1"/><text x="796.6" y="812.1" fill="#243342" font-family="DM Sans" font-size="13" font-weight="500">Sự kiện ở Đà Nẵng có gì?</text><rect x="33" y="841" width="324" height="42" rx="0" fill="rgba(0,0,0,0)" stroke="none" stroke-width="0"/><rect x="33" y="841" width="276" height="42" rx="8" fill="#ffffff" stroke="#e3ded2" stroke-width="1"/><rect x="317" y="842" width="40" height="40" rx="8" fill="#e4572